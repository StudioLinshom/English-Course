<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 מילים באנגלית</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F7A4D">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מילים באנגלית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --field:#1F7A4D; --field-2:#2E9A63; --chalk:#F7F9F4; --paper:#FFFFFF;
  --ink:#1C2B4B; --muted:#5B6A85; --sun:#FFC83D; --coral:#F2574A; --line:#DCE4DA;
  --good-bg:#E3F5EA; --bad-bg:#FDE7E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#3FB97A; --field-2:#56CF8E; --chalk:#121A2B; --paper:#1B2540;
    --ink:#EEF2F8; --muted:#A3B0C8; --sun:#FFD25E; --coral:#FF7A6E; --line:#2C3858;
    --good-bg:#16382A; --bad-bg:#40201F;
  }
}
:root[data-theme="dark"]{
  --field:#3FB97A; --field-2:#56CF8E; --chalk:#121A2B; --paper:#1B2540;
  --ink:#EEF2F8; --muted:#A3B0C8; --sun:#FFD25E; --coral:#FF7A6E; --line:#2C3858;
  --good-bg:#16382A; --bad-bg:#40201F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:"Rubik","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.en{font-family:"Fredoka","Rubik",Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Scoreboard hero */
.board{background:var(--field);color:#fff;border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:3px solid rgba(255,255,255,.18);border-radius:50%}
.board h1{margin:0;font-size:20px;font-weight:700}
.big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.big .n{font-family:"Fredoka",sans-serif;font-size:64px;font-weight:700;line-height:1;color:var(--sun)}
.big .of{font-size:18px;opacity:.9}
.bar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.stats{display:flex;gap:18px;margin-top:12px;font-size:15px;opacity:.95}

h2{font-size:18px;margin:26px 0 10px}
.levels{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.lv{flex:none;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-size:15px;font-weight:600}
.lv.cur{background:var(--field);border-color:var(--field);color:#fff}
.lv:disabled{opacity:.55;cursor:default}
.mode.review{margin-top:12px}
.mode.review.due{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb, var(--sun) 35%, transparent)}
.mode.gram{margin-top:12px}
.week.sent{border-style:dashed}
.week.sent:disabled{opacity:.6}
.week.test{border-color:var(--sun)}
.mode.dict{margin-top:12px}
.filebtn{display:block;text-align:center;cursor:pointer}
.filebtn.busy,[data-a=manual].busy{opacity:.5;pointer-events:none}
.feedback.reading{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.feedback.reading .mascot{animation:float 1.2s ease-in-out infinite}
.editrows{display:grid;gap:8px;margin:10px 0}
.er{display:grid;grid-template-columns:1fr 1fr 20px 34px;gap:6px;align-items:center}
.er .field{padding:10px;font-size:16px}
.er .auto{font-size:14px;text-align:center}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--chalk);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:6px;box-shadow:0 -10px 12px -10px rgba(0,0,0,.18)}
.savebar .btn{margin-top:4px}
.savebar .feedback{margin-top:0;min-height:0}
details.raw pre{white-space:pre-wrap;direction:ltr;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;max-height:180px;overflow:auto}
.mascot.emoji{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.bubble small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.buddies{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.bud{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 2px 8px;display:grid;justify-items:center;gap:4px;font-size:14px}
.bud.on{border-color:var(--field);background:var(--good-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--field) 25%,transparent)}
.bud.on .mascot{animation:jump .5s}
@media (max-width:360px){.buddies{grid-template-columns:repeat(3,1fr)}}
/* fun */
.board{background:linear-gradient(135deg,var(--field) 0%,var(--field-2) 100%)}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 12% 22%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 78% 14%,#fff 1px,transparent 2px),
             radial-gradient(circle at 88% 70%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 30% 85%,#fff 1px,transparent 2px)}
.buddy{display:flex;align-items:center;gap:12px;margin-top:12px}
.buddy-pick{flex:none;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;color:var(--muted)}
.buddy-pick span{font-size:12px;font-weight:600;border:2px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--paper);white-space:nowrap}
.buddy .mascot{flex:none;animation:float 3s ease-in-out infinite}
.bubble{flex:1;min-height:58px;display:flex;align-items:center;position:relative;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:600;font-size:15px}
.bubble::before{content:"";position:absolute;inset-inline-start:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-inline-end-color:var(--line)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.num.ic{position:relative;font-size:24px}
.num.ic small{position:absolute;bottom:-4px;inset-inline-start:-4px;background:var(--field);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-family:"Rubik",sans-serif}
.weeks .week:nth-child(6n+1) .num{background:rgba(242,87,74,.16)}
.weeks .week:nth-child(6n+2) .num{background:rgba(255,200,61,.28)}
.weeks .week:nth-child(6n+3) .num{background:rgba(77,163,255,.18)}
.weeks .week:nth-child(6n+4) .num{background:rgba(46,154,99,.18)}
.weeks .week:nth-child(6n+5) .num{background:rgba(181,123,255,.18)}
.weeks .week:nth-child(6n+6) .num{background:rgba(255,143,177,.22)}
.weeks .week.done{border-color:color-mix(in srgb,var(--field) 45%,var(--line))}
.week,.mode,.lv,.opt,.btn,.tile{transition:transform .12s}
.week:active,.mode:active,.lv:active,.opt:active,.btn:active,.tile:active{transform:scale(.97)}
#cheer{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);display:flex;align-items:center;gap:8px;z-index:50;pointer-events:none;
  background:var(--paper);border:2px solid var(--sun);border-radius:99px;padding:4px 16px 4px 6px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:700;font-size:17px;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
#cheer.show{transform:translate(-50%,0)}
#cheer.sad{border-color:var(--line)}
#cheer.show .mascot{animation:jump .5s}
#cheer.show.sad .mascot{animation:tilt .7s}
@keyframes jump{0%{transform:translateY(10px) scale(.7)}45%{transform:translateY(-8px) scale(1.1)}100%{transform:none}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}65%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opt.wrong,.shake{animation:shake .45s}
.opt.right,.good{animation:pop .45s}
input.type.good,.built.good{border-color:var(--field-2);background:var(--good-bg)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.res-buddy .mascot{animation:jump .6s}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0}
.stars span{font-size:46px;line-height:1;color:var(--line);display:inline-block;transform:scale(0);animation:starIn .45s forwards}
.stars span.on{color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.08)}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.n.grow{animation:pop .7s;display:inline-block}
.mode.next{animation:wiggle 2.5s ease-in-out infinite}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-1.5deg)}96%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){
  .buddy .mascot,#cheer .mascot,.res-buddy .mascot,.bud.on .mascot,.opt.wrong,.opt.right,.shake,.good,.n.grow,.mode.next{animation:none!important}
  .stars span{animation:none;transform:none}
  #cheer{transition:none}
}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:600}
.ghost.sm{padding:4px 9px;font-size:14px;white-space:nowrap}
.who .hi{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .tools{display:flex;gap:6px;flex-shrink:0}
.links.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.links.three .ghost{padding:8px 4px;white-space:nowrap}
.dlg-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:dlgIn .15s ease-out}
.dlg{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px 18px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.dlg .dlg-buddy{margin:-4px auto 6px;width:56px}
.dlg p{margin:0 0 6px;font-size:17px;font-weight:700;line-height:1.5}
.dlg small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.dlg-in{width:100%;margin-top:10px;padding:12px;font-size:17px;border:2px solid var(--line);border-radius:12px;background:var(--chalk);color:var(--ink);text-align:center}
.dlg .row{margin-top:16px}
.dlg .btn{padding:12px}
.dlg .btn.danger{background:var(--coral);color:#fff}
@keyframes dlgIn{from{opacity:0}to{opacity:1}}
.board .sub{margin:6px 0 0;opacity:.95}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:15px;color:var(--muted)}
.field{width:100%;padding:12px;font-size:18px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.field.en{text-align:left;letter-spacing:1px}
.result .code{font-size:40px;letter-spacing:2px;margin:12px 0}
details.note{margin-top:22px}
.wl.fam small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.tag{font-size:13px;color:var(--field);font-weight:600}
details.note summary{cursor:pointer}
.gbar{background:var(--line);margin:12px 0 0}
.rule{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.rule p{margin:0 0 8px}
.rule ul{margin:0 0 8px;padding-inline-start:20px}
.rule li{margin:4px 0}
.wl.ex{flex-wrap:wrap}
.wl.ex .en{flex-basis:100%;font-size:17px}
.sent{font-size:24px;font-weight:600;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--sun);margin:0 4px}
.opt.sent-opt{font-size:17px;text-align:left}
.sent-ans{font-size:20px;margin:6px 0}
.built{min-height:58px;margin-top:14px;padding:8px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .ph{color:var(--muted);font-size:14px;font-family:"Rubik",sans-serif;direction:rtl;width:100%;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.tile{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:600}
.built .tile{border-color:var(--field-2)}
.btn:disabled{opacity:.5}
.mode.next{margin-top:12px;border-color:var(--sun);background:var(--sun);color:#1C2B4B}
.mode.next span{color:#1C2B4B}
.weeks{display:grid;gap:10px}
.week{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:right;width:100%}
.week .num{flex:none;width:42px;height:42px;border-radius:12px;background:var(--chalk);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:20px;color:var(--field)}
.week.done .num.ic small{background:var(--field-2)}
.week .t{flex:1;min-width:0}
.week .t b{display:block;font-size:16px}
.week .t span{font-size:14px;color:var(--muted)}
.mini{height:6px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--field-2)}

.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sync{margin-inline-start:auto;align-self:center;font-size:14px;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-inline-end:6px;vertical-align:middle}
.sync[data-s="ok"]::before{background:var(--field-2)}
.sync[data-s="saving"]::before{background:var(--sun)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;color:var(--muted)}

/* Screens */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px}
.top .title{font-weight:700;flex:1}
.modes{display:grid;gap:10px}
.mode{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:right;width:100%}
.mode b{display:block;font-size:17px}
.mode span{color:var(--muted);font-size:14px}
.wordlist{margin-top:20px;background:var(--paper);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.wl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .en{font-size:18px;font-weight:600}
.dots{display:flex;gap:3px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--field-2)}
.wl .en{flex:1}
.mk{flex:none;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted)}
.mk.on{background:var(--field);border-color:var(--field);color:#fff}

/* Card */
.progress{font-size:14px;color:var(--muted);margin-bottom:8px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;min-height:230px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.card .word{font-size:44px;font-weight:700;line-height:1.1}
.card .he{font-size:28px;font-weight:700}
.card .hint{font-size:15px;color:var(--muted)}
.say{background:var(--chalk);border-radius:99px;padding:6px 14px;font-size:15px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border-radius:14px;padding:14px;font-size:17px;font-weight:700}
.btn.go{background:var(--field);color:#fff}
.btn.no{background:var(--paper);border:2px solid var(--line)}
.btn.wide{width:100%;margin-top:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:20px;font-weight:600;width:100%}
.opt.right{background:var(--good-bg);border-color:var(--field-2)}
.opt.wrong{background:var(--bad-bg);border-color:var(--coral)}
input.type{width:100%;margin-top:14px;padding:14px;font-size:24px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:center}
.feedback{margin-top:10px;font-weight:700;min-height:26px;text-align:center}
.feedback.ok{color:var(--field)} .feedback.bad{color:var(--coral)}

.result{text-align:center}
.result .n{font-family:"Fredoka",sans-serif;font-size:72px;color:var(--field);font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:4px 12px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
#flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.show{opacity:1}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const LEVELS = [
 {n:1, weeks:[
  {n:1,name:"בית ומשפחה",words:[["kitchen","מטבח"],["bedroom","חדר שינה"],["bathroom","חדר רחצה"],["living room","סלון"],["stairs","מדרגות"],["roof","גג"],["neighbor","שכן"],["parents","הורים"],["grandparents","סבא וסבתא"],["cousin","בן/בת דוד"],["aunt","דודה"],["uncle","דוד"],["together","ביחד"]]},
  {n:2,name:"פעלים",words:[["bring","להביא","brought"],["buy","לקנות","bought"],["build","לבנות","built"],["choose","לבחור","chose"],["forget","לשכוח","forgot"],["remember","לזכור","remembered"],["explain","להסביר","explained"],["borrow","לשאול (חפץ)","borrowed"],["carry","לסחוב","carried"],["finish","לסיים","finished"],["wait","לחכות","waited"],["win","לנצח","won"],["lose","להפסיד","lost"],["decide","להחליט","decided"],["believe","להאמין","believed"]]},
  {n:3,name:"תארים ורגשות",words:[["angry","כועס"],["afraid","מפחד"],["bored","משועמם"],["proud","גאה"],["tired","עייף"],["worried","מודאג"],["excited","נרגש"],["surprised","מופתע"],["quiet","שקט"],["loud","רועש"],["dangerous","מסוכן"],["easy","קל"],["difficult","קשה"],["important","חשוב"]]},

let audioCtx = null;
function tones(freqs, dur = .1, type = "sine", vol = .07){
  if(!soundOn()) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    for(const f of freqs){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
      t += dur * .8;
    }
  }catch(e){}
}

function confetti(n = 90){
  if(calm()) return;
  const c = document.createElement("canvas"), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.className = "confetti"; c.width = W*dpr; c.height = H*dpr;
  document.body.appendChild(c);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const colors = ["#FFC83D","#F2574A","#2E9A63","#4DA3FF","#B57BFF","#FF8FB1"];
  const ps = Array.from({length:n}, () => ({x:W/2 + (Math.random()-.5)*90, y:H*.42, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4,
    r:Math.random()*7+5, a:Math.random()*6, va:(Math.random()-.5)*.4, c:pick(colors)}));
  const t0 = performance.now();
  (function frame(t){
    g.clearRect(0, 0, W, H);
    for(const q of ps){ q.vy += .35; q.x += q.vx; q.y += q.vy; q.a += q.va;
      g.save(); g.translate(q.x, q.y); g.rotate(q.a); g.fillStyle = q.c; g.fillRect(-q.r/2, -q.r/4, q.r, q.r/2); g.restore(); }
    if(t - t0 < 1900) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function dialog({text, sub="", ok="אישור", cancel="ביטול", input=null, danger=false}){
  return new Promise(res=>{
    const w = document.createElement("div"); w.className = "dlg-wrap";
    w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">
      <div class="dlg-buddy">${mascot("", 56)}</div>

      ${input!==null ? `<input class="dlg-in" maxlength="60" value="${esc(input)}">` : ""}
      <div class="row" ${cancel ? "" : 'style="grid-template-columns:1fr"'}><button class="btn ${danger ? "danger" : "go"}" data-r="ok">${esc(ok)}</button>${cancel ? `<button class="btn no" data-r="no">${esc(cancel)}</button>` : ""}</div>
    </div>`;
    document.body.appendChild(w);
    const inp = w.querySelector(".dlg-in");
    const done = v => { w.remove(); document.removeEventListener("keydown", key); res(v); };
    const no = () => done(inp ? null : false);
    const key = e => { if(e.key==="Escape") no(); if(e.key==="Enter" && (inp || !cancel)) done(inp ? inp.value : true); };
    document.addEventListener("keydown", key);
    w.querySelector('[data-r="ok"]').onclick = () => done(inp ? inp.value : true);
    const c = w.querySelector('[data-r="no"]'); if(c) c.onclick = no;
    w.onclick = e => { if(e.target===w) no(); };
    if(inp){ inp.focus(); inp.select(); } else w.querySelector('[data-r="ok"]').focus();
  });
}

// Quiz/typing round: words not yet known (weakest first) plus a few known words
// for review. When everything is known, the whole round is review.
function pickRound(list){ return pickBy(list, x=>sc(x.en)); }
function pickBy(list, score){
  const weak = shuffle(list.filter(x=>score(x)<MASTER)).sort((a,b)=>score(a)-score(b));
  const strong = shuffle(list.filter(x=>score(x)>=MASTER));
  if(!weak.length) return strong.slice(0, ROUND);
  const review = Math.min(strong.length, weak.length >= ROUND ? 2 : 3);
  return shuffle([...weak.slice(0, ROUND-review), ...strong.slice(0, review)]);
}
const OLD_PER_ROUND = 2, REVIEW_ROUND = 10, REVIEW_EVERY = 7;
const prevWords = () => LEVEL_WORDS.slice(0, S.level-1).flat();
// Old words to bring back: ones not (or no longer) known first, then the least
// recently practiced, then the ones with most mistakes.
function oldestFirst(list, n){
  const rank = x => sc(x.en) >= MASTER ? 1 : 0;
  return shuffle(list).sort((a,b)=> rank(a)-rank(b) || (S.seen[a.en]||"").localeCompare(S.seen[b.en]||"") || (S.wrong[b.en]||0)-(S.wrong[a.en]||0)).slice(0, n);
}
// Flashcards: words not yet known first, known ones at the end.
function flashOrder(list){
  return [...shuffle(list.filter(x=>sc(x.en)<MASTER)), ...shuffle(list.filter(x=>sc(x.en)>=MASTER))];
}
function start(mode, list){
  let items = mode==="place" ? shuffle(ALL) : (mode==="flash" ? flashOrder(list) : pickRound(list));
  // Quiz and typing in level 2+ also bring back a couple of words from earlier levels (not in a dictation).
  if((mode==="quiz" || mode==="type") && S.level > 1 && !view.custom){
    const old = oldestFirst(prevWords(), OLD_PER_ROUND);
    items = shuffle([...items, ...old]);
  }
  const back = view.custom ? {name:"week", custom:view.custom} : view.w ? {name:"week", w:view.w} : null;
  go({name:"play", mode, items, i:0, right:0, missed:[], pool:list, back});
}

function startReview(){
  const prev = prevWords();
  go({name:"play", mode:"quiz", review:true, items:oldestFirst(prev, REVIEW_ROUND), i:0, right:0, missed:[], pool:prev, back:null});
}
function reviewCard(){
  if(S.level < 2) return "";
  const ago = daysSince(S.lastReview), due = ago >= REVIEW_EVERY;
  const when = S.lastReview ? (ago===0 ? "חזרה אחרונה: היום" : `חזרה אחרונה: לפני ${ago} ימים`) : "עוד לא עשית חזרה";
  return `<button class="mode review ${due?'due':''}" data-a="review"><b>🔁 ${due?'הגיע הזמן לחזרה! ':''}חזרה על שלבים קודמים</b><span>${REVIEW_ROUND} שאלות ממילים של ${S.level===2?'שלב 1':'שלבים 1–'+(S.level-1)}. ${when}.</span></button>`;
}
function play(){
  const v=view, x=v.items[v.i];

// TENSES[lv-1][n]: unit n of word level lv. Level 1 keeps its original sentences and ids ("ps:3"); others are "L2ps:3".
const TENSES = LEVELS.map((l, k) => GRAMMAR.map(u => k===0 ? Object.assign(u, {lv:1})
  : Object.assign({}, u, {lv:k+1, items:((LEVEL_TENSES[k+1]||{})[u.id]||[]).map((it, i) => Object.assign(it, {id:"L"+(k+1)+u.id+":"+i}))})));
const tensesOf = lv => TENSES[lv-1];
const gsc = it => S.gscore[it.id] || 0;
const gknown = u => u.items.filter(it => gsc(it) >= MASTER).length;
const gtried = u => u.items.filter(it => gsc(it) >= 1).length;               // answered right at least once
const gpoints = u => u.items.reduce((t, it) => t + gsc(it), 0) / (u.items.length * MASTER); // 0..1, grows with every right answer
const lvItems = lv => tensesOf(lv).flatMap(u => u.items);
// A tense is caught when all its sentences are caught.
const tensesDone = lv => tensesOf(lv).filter(u => gknown(u) === u.items.length).length;

/* ---------- level test ---------- */
// Each word level ends with a test: TEST_N words from the whole level, choosing and typing mixed.
// Passing it (TEST_PASS right) opens that level's tenses. It never blocks the next level.
const TEST_N = 20, TEST_PASS = 16;
const testOf = lv => S.ltest[lv] || null;
const passedTest = lv => (testOf(lv)?.best || 0) >= TEST_PASS;
// S.gunlocked["L"+lv]: true = opened by a parent (or kept from before), false = closed by a parent, unset = opens with the test.
const tensesOpen = lv => S.gunlocked["L"+lv] ?? passedTest(lv);
function migrateTenses(){
  // Tenses used to open by known words; anyone who already practiced level-1 sentences keeps them open.
  if(S.gbylevel) return;
  const had = Object.keys(S.gscore).some(k => /^(ps|pc|pa|im|fu|lk):/.test(k) && S.gscore[k] > 0);
  S.gunlocked = had ? {L1:true} : {};
  S.gbylevel = true; delete S.gbywords;
}
function startTest(){
  go({name:"play", mode:"test", lv:S.level, items:shuffle(ALL).slice(0, TEST_N), i:0, right:0, missed:[], pool:ALL, back:null});
}
function finishTest(v){
  const t = S.ltest[v.lv] || {best:0, tries:0}, wasOpen = tensesOpen(v.lv);
  t.tries++; t.last = v.right; t.date = today();
  if(v.right >= t.best) t.best = v.right;
  S.ltest[v.lv] = t; save();
  go({name:"result", mode:"test", lv:v.lv, right:v.right, total:v.items.length, missed:v.missed, opened:!wasOpen && tensesOpen(v.lv), back:null});
}
function testResult(){
  const v=view, pass = v.right >= TEST_PASS, t = testOf(v.lv);
  const msg = pass ? (v.opened ? `🎉 עברת את מבחן שלב ${v.lv}! הזמנים של השלב נפתחו.` : `עברת את מבחן שלב ${v.lv}!`)
    : `כדי לעבור צריך ${TEST_PASS} תשובות נכונות מתוך ${v.total}. עוד קצת תרגול ונסה שוב, אפשר כמה פעמים שרוצים.`;
  app.innerHTML = `
  <div class="result">
    ${resultTop(v.right, v.total)}
    <p>${msg}</p>
    <p class="note">הציון הכי טוב שלך: ${t ? t.best : v.right}/${v.total}</p>
    ${v.missed.length?`<h2>מילים לחזרה</h2><div class="chips">${v.missed.map(x=>`<span class="chip"><span class="en">${esc(x.en)}</span> · ${esc(x.he)}</span>`).join("")}</div>`:""}
    ${tensesOpen(v.lv) ? `<button class="btn go wide" data-a="tenses">⏳ לזמנים</button>` : `<button class="btn go wide" data-a="retry">לנסות שוב</button>`}
    <button class="ghost" style="width:100%;margin-top:10px" data-a="home">למסך הבית</button>
  </div>`;
  const tn = app.querySelector('[data-a="tenses"]'); if(tn) tn.onclick=()=>go({name:"grammar", lv:v.lv});
  const rt = app.querySelector('[data-a="retry"]'); if(rt) rt.onclick=startTest;
  app.querySelector('[data-a="home"]').onclick=()=>go({name:"home"});
  if(pass) celebrateResult(v.right, v.total);
}
function testTile(){
  const t = testOf(S.level), pass = passedTest(S.level);
  return `<button class="week test ${pass?'done':''}" data-a="ltest"><span class="num ic">🏁</span><span class="t"><b>מבחן שלב ${S.level}</b><span>${t ? `הציון הכי טוב: ${t.best}/${TEST_N}${pass ? " ✓ עברת" : ` · עוברים ב-${TEST_PASS}`}` : `${TEST_N} מילים מכל השלב · עוברים ב-${TEST_PASS} נכונות`}</span></span></button>`;
}
function tensesTile(){
  const lv = S.level, o = tensesOpen(lv), units = tensesOf(lv), k = tensesDone(lv), all = lvItems(lv);
  const p = Math.round(all.reduce((t, it) => t + gsc(it), 0) / (all.length * MASTER) * 100);
  return `<button class="week sent ${o && k===units.length?'done':''}" data-a="tenses" ${o?'':'disabled'}>
    <span class="num ic">${o ? "⏳" : "🔒"}</span>
    <span class="t"><b>זמנים · שלב ${lv}</b><span>${o ? `נתפסו ${k} מתוך ${units.length} זמנים` : "ייפתח אחרי שתעבור את מבחן השלב"}</span>${o ? `<span class="mini"><i style="width:${p}%"></i></span>` : ""}</span>
  </button>`;
}

const gstats = u => `נכון לפחות פעם אחת: ${gtried(u)}/${u.items.length} · נתפסו: ${gknown(u)}`;
function gbump(it, ok){
  S.gscore[it.id] = ok ? Math.min(MASTER, gsc(it)+1) : 0;
  if(!ok) S.gwrong[it.id] = (S.gwrong[it.id]||0)+1;
  const d = today();
  S.gseen[it.id] = d;
  if(!S.days.includes(d)) S.days.push(d);
  save();
}
function gRound(lv, n){
  const units = tensesOf(lv), items = pickBy(units[n].items, gsc);
  // Bring back sentences from this level's earlier tenses: not known first, then least recently practiced.
  const rank = it => gsc(it) >= MASTER ? 1 : 0;
  const old = shuffle(units.slice(0, n).flatMap(u=>u.items))
    .sort((a,b)=> rank(a)-rank(b) || (S.gseen[a.id]||"").localeCompare(S.gseen[b.id]||"")).slice(0, OLD_PER_ROUND);
  return shuffle([...items, ...old]);
}
const gText = it => it.t==="order" ? it.w + it.p : it.t==="fill" ? it.s.replace("___", it.a) : it.a;
const tileText = (t, i) => i===0 && t!=="I" && !t.startsWith("I'") ? t.charAt(0).toLowerCase() + t.slice(1) : t;
const unitOf = it => TENSES.flat().find(u => u.items.includes(it));

      <span class="num ic">${UNIT_ICONS[u.id]||"✍️"}<small>${n+1}</small></span>

function gplay(){
  const v=view, it=v.items[v.i];
  if(!it) return go({name:"gresult", lv:v.lv, n:v.n, right:v.right, total:v.items.length, missed:v.missed});
  const u = unitOf(it);
  const head = `<div class="top"><button class="back" data-a="quit">יציאה</button><span class="title">${u.name}</span></div>
  <div class="progress">${v.i+1} מתוך ${v.items.length}</div>`;
  let body = "";
  if(it.t==="fill"){
    const [pre, post] = it.s.split("___");
    v.opts = v.opts || shuffle([it.a, ...it.o]);
    body = `<div class="card pop"><div class="sent en">${esc(pre)}<span class="blank">&nbsp;</span>${esc(post)}</div><div class="hint">${esc(it.he)}</div></div>
      <div class="opts">${v.opts.map((o,k)=>`<button class="opt en" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else if(it.t==="choose"){
    v.opts = v.opts || shuffle([it.a, ...it.o]);
    body = `<div class="card pop"><div class="he">${esc(it.he)}</div><div class="hint">בחר את המשפט הנכון</div></div>
      <div class="opts">${v.opts.map((o,k)=>`<button class="opt en sent-opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else {
    if(!v.tiles){ const words = it.w.split(" "); v.tiles = shuffle([...words.map(tileText), it.d]).map((t,k)=>({t,k})); v.built = []; }
    body = `<div class="card pop"><div class="he">${esc(it.he)}</div><div class="hint">סדר את המילים למשפט באנגלית</div></div>
      <div class="built en" id="built">${v.built.map(k=>`<button class="tile" data-b="${k}">${esc(v.tiles[k].t)}</button>`).join("") || '<span class="ph">לחץ על המילים לפי הסדר</span>'}</div>
      <div class="tiles en">${v.tiles.map(x=>v.built.includes(x.k)?'':`<button class="tile" data-t="${x.k}">${esc(x.t)}</button>`).join("")}</div>
      <button class="btn go wide" data-a="check" ${v.built.length?'':'disabled'}>בדיקה</button>`;
  }
  app.innerHTML = head + body + `<div class="feedback" id="fb"></div>`;
  app.querySelector('[data-a="quit"]').onclick=()=>go({name:"gunit", lv:v.lv, n:v.n});

  const finish = ok => {
    const was = gsc(it);
    gbump(it, ok); if(ok) v.right++; else v.missed.push(it);
    react(ok, was < MASTER && gsc(it) >= MASTER, v, "משפט");
    const built = document.getElementById("built"); if(built) built.classList.add(ok ? "good" : "shake");
    const fb=document.getElementById("fb");
    fb.className="feedback "+(ok?"ok":"bad");
    fb.innerHTML = (ok ? "✅ " + pick(PRAISE) + " " : "💡 התשובה הנכונה: ") + `<div class="en sent-ans">${esc(gText(it))}</div><button class="btn go wide" data-a="next">הבא</button>`;
    speak(gText(it));
    app.querySelectorAll(".opt,.tile,[data-a=check]").forEach(b=>b.disabled=true);
    app.querySelector('[data-a="next"]').onclick=next;
  };
  if(it.t==="fill" || it.t==="choose"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const pick=v.opts[+b.dataset.k], ok = pick===it.a;
      app.querySelectorAll(".opt").forEach((bb,k)=>{ if(v.opts[k]===it.a) bb.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      finish(ok);
    });
  } else {
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ v.built.push(+b.dataset.t); render(); });
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ v.built = v.built.filter(k=>k!==+b.dataset.b); render(); });
    app.querySelector('[data-a="check"]').onclick=()=>{
      const said = v.built.map(k=>v.tiles[k].t).join(" ").toLowerCase();
      finish([it.w, ...it.alt].some(a=>a.toLowerCase()===said));
    };
  }
  function next(){ if(view!==v) return; v.i++; v.opts=null; v.tiles=null; v.built=null; render(); window.scrollTo(0,0); }
}

/* ---------- dictations: photographed or typed word lists ---------- */
const DICT_MAX = 50;
const dictById = id => (S.dict || []).find(d => d.id === id);
const dictWords = d => d.words.map(([en, he]) => ({en, he, week:"d:" + d.id}));
const defaultDictName = () => { const t = new Date(); return `הכתבה ${t.getDate()}/${t.getMonth()+1}`; };
function dictCard(){
  const n = (S.dict || []).length;
  return `<button class="mode dict" data-a="dicts"><b>📷 הכתבות</b><span>${n ? `${n} הכתבות שמורות · אפשר להוסיף חדשה` : "מצלמים רשימת מילים מבית הספר ומתרגלים אותה"}</span></button>`;
}
// Photos are shrunk on the phone before upload: enough detail for OCR, a fraction of the size.
function shrinkImage(file, max = 2200){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", .9).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

function dictEditScreen(){
  const v = view;
  v.rows = v.rows && v.rows.length ? v.rows : [["",""]];
  app.innerHTML = `
  <div class="top"><button class="back" data-a="back">ביטול</button><span class="title">${v.id ? "עריכת הכתבה" : "הכתבה חדשה"}</span></div>
  <div class="form"><label>שם ההכתבה<input class="field" id="dn" maxlength="40" value="${esc(v.title || "")}"></label></div>
  <p class="note">בדקו שכל מילה נכונה, מחקו מה שלא שייך, והוסיפו מה שחסר (עד ${DICT_MAX} מילים). גוללים למטה כדי לעבור על כל הרשימה.${v.rows.some(r=>r[2]) ? " תרגום שמסומן ב-🌐 נעשה אוטומטית, כדאי לבדוק אותו." : ""}</p>
  ${v.raw ? `<details class="note raw"><summary>הטקסט שגוגל קרא מהתמונה</summary><pre>${esc(v.raw)}</pre></details>` : ""}
  <div class="editrows">${v.rows.map((r,i)=>`<div class="er">
    <input class="field en" data-en="${i}" value="${esc(r[0])}" placeholder="English" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input class="field" data-he="${i}" value="${esc(r[1])}" placeholder="תרגום">
    ${r[2] ? `<span class="auto" title="תרגום אוטומטי">🌐</span>` : `<span class="auto"></span>`}
    <button class="mk" data-rm="${i}" aria-label="מחיקת שורה">✕</button></div>`).join("")}</div>
  <button class="btn no wide" data-a="add" ${v.rows.length >= DICT_MAX ? "disabled" : ""}>➕ הוספת מילה</button>
  <button class="btn no wide" data-a="tr">🌐 תרגום אוטומטי למילים בלי תרגום</button>
  <div class="savebar">
    <div class="feedback bad" id="fb"></div>
    <button class="btn go wide" data-a="save">💾 שמירה ותרגול · <span id="cnt">${v.rows.filter(r=>r[0].trim()).length}</span> מילים</button>
  </div>`;
  const fb = document.getElementById("fb");
  document.getElementById("dn").oninput = e => { v.title = e.target.value; };
  const count = () => { document.getElementById("cnt").textContent = v.rows.filter(r=>r[0].trim()).length; };
  app.querySelectorAll("[data-en]").forEach(el=>el.oninput=()=>{ v.rows[+el.dataset.en][0] = el.value; count(); });
  app.querySelectorAll("[data-he]").forEach(el=>el.oninput=()=>{ const r = v.rows[+el.dataset.he]; r[1] = el.value; r[2] = false; });
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ v.rows.splice(+b.dataset.rm, 1); render(); });
  app.querySelector('[data-a="add"]').onclick=()=>{
    if(v.rows.length >= DICT_MAX) return;
    v.rows.push(["",""]); render();
    const last = app.querySelectorAll("[data-en]"); last[last.length-1].focus();
  };
  app.querySelector('[data-a="back"]').onclick=()=>go(v.id ? {name:"week", custom:v.id} : {name:"dicts"});
  app.querySelector('[data-a="tr"]').onclick=async e=>{
    const need = v.rows.filter(r=>r[0].trim() && !r[1].trim());
    if(!need.length){ fb.textContent = "לכל המילים כבר יש תרגום."; return; }
    e.target.disabled = true; fb.className = "feedback"; fb.textContent = "מתרגם…";
    try{
      const j = await api({action:"translate", u:USER, words:need.map(r=>r[0].trim())}); // the server lowercases (except "I")
      if(!j.ok) throw new Error(j.error);
      need.forEach((r,i)=>{ if(j.words[i]){ r[1] = j.words[i][1]; r[2] = true; } });
      render();
    }catch(err){ fb.className = "feedback bad"; fb.textContent = errText(err); e.target.disabled = false; }
  };
  app.querySelector('[data-a="save"]').onclick=()=>{
    const seen = {}, words = [];
    for(const r of v.rows){
      let en = r[0].trim().replace(/\s+/g, " "), he = r[1].trim();
      if(!en) continue;
      if(!/^[A-Za-z][A-Za-z' \-]*$/.test(en)){ fb.textContent = `"${en}" לא נראית כמו מילה באנגלית. תקנו או מחקו אותה.`; return; }
      if(en !== "I") en = en.toLowerCase();
      if(seen[en]) continue; seen[en] = 1;
      if(!he){ fb.textContent = `חסר תרגום ל-"${en}". אפשר ללחוץ על "תרגום אוטומטי".`; return; }
      words.push([en, he]);
    }
    if(words.length < 2){ fb.textContent = "צריך לפחות 2 מילים."; return; }
    if(words.length > DICT_MAX){ fb.textContent = `אפשר עד ${DICT_MAX} מילים בהכתבה אחת. מחקו ${words.length - DICT_MAX} מילים.`; return; }
    const name = (v.title || "").trim() || defaultDictName();
    let id = v.id;
    if(id){ const d = dictById(id); d.name = name; d.words = words; }
    else { id = Date.now().toString(36); S.dict.push({id, name, created:today(), words}); }
    save();
    go({name:"week", custom:id});
    SFX.star(); cheer("ההכתבה נשמרה! בוא נתרגל"); confetti(50);
  };
}

    if(p1 !== p2) return go({name:"pinset", err:"שני הקודים לא זהים."});
    S.pinHash = await pinHash(p1); save();
    await unlockFamily(p1); go({name:"parent"}); flash("קוד ההורה נשמר");
  };
}

function openParent(){ go({name: parentOk.has(USER) ? "parent" : S.pinHash ? "pin" : "pinset"}); }

function familySection(){
  const atLeast3 = m => Object.values(m || {}).filter(v => v >= MASTER).length;
  const rows = deviceUsers().map(x=>{
    const d = x.u === USER ? S : localData(x.u), last = (d.days || []).slice(-1)[0];
    const btn = x.u === USER ? `<span class="tag">מוצג עכשיו</span>` : `<button class="mk" data-manage="${x.u}">ניהול${parentOk.has(x.u) ? "" : " 🔒"}</button>`;
    return `<div class="wl fam"><span><b>${buddyOf(d).icon} ${esc(x.name)}</b><small>${atLeast3(d.score)} מילים · ${atLeast3(d.gscore)} משפטים · ${last ? "תרגול אחרון " + last.split("-").reverse().slice(0,2).join("/") : "עוד לא תרגל"}</small></span>${btn}</div>`;
  }).join("");
  return `<h2>המשפחה</h2><div class="wordlist">${rows}</div>
  <div class="links"><button class="ghost" data-a="addkid">הוספת ילד</button></div>
  <p class="note">כל ילד מנוהל בנפרד. ילדים עם אותו קוד הורה נפתחים יחד, בלי להקליד שוב.</p>`;
}

function parent(){
  if(!parentOk.has(USER)) return openParent();
  refreshFamily();
  const hard = Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,15)
    .map(([en,n])=>{ const x=EVERY.find(w=>w.en===en); return x?{...x,n}:null; }).filter(Boolean);
  const last = S.days.slice(-14).reverse();
  app.innerHTML = `
  <div class="top"><button class="back" data-a="home">חזרה</button><span class="title">מסך הורה · ${esc(USERNAME)}</span></div>
  ${familySection()}
  <h2>${esc(USERNAME)}</h2>
  <div class="wordlist">
    <div class="wl"><span>שם</span><b>${esc(USERNAME)}</b><button class="mk" data-a="rename">שינוי</button></div>
    <div class="wl"><span>קוד משתמש</span><b class="en" style="white-space:nowrap">${fmtCode(USER)}</b><button class="mk" data-a="share">העתקת קישור</button></div>
  </div>
  <p class="note">כדי לראות את ההתקדמות מהטלפון שלכם, פתחו בו את הקישור, או הקלידו את הקוד במסך הכניסה. שמרו את הקוד: בלעדיו אי אפשר לחזור למשתמש.</p>
  <div class="links"><button class="ghost" data-a="newpin">שינוי קוד הורה</button><button class="ghost" data-a="forget">הסרת המשתמש מהטלפון הזה</button></div>
  <h2>שלב ${S.level}</h2>
  <div class="wordlist">
    ${WEEKS.map(w=>{const l=ALL.filter(x=>x.week===w.n);return `<div class="wl"><span>${w.n}. ${w.name}</span><b>${known(l)} / ${l.length}</b></div>`;}).join("")}
    <div class="wl"><span><b>סה"כ בשלב</b></span><b>${known(ALL)} / ${ALL.length}</b></div>
  </div>
  <h2>כל השלבים</h2>
  <div class="wordlist">
    ${LEVELS.map(l=>{ const lw=LEVEL_WORDS[l.n-1], o=isOpen(l.n);
      const dropped = lw.filter(x=>S.forgot[x.en] && sc(x.en)<MASTER).length;
      return `<div class="wl"><span>שלב ${l.n}${o?'':' 🔒'}${dropped?` <span class="note" style="margin:0">(${dropped} נשכחו)</span>`:''}</span><b>${known(lw)} / ${lw.length}</b>${l.n===1?'':o?`<button class="mk" data-c="${l.n}">סגור</button>`:`<button class="mk" data-u="${l.n}">פתח</button>`}</div>`; }).join("")}
    <div class="wl"><span><b>סה"כ מילים שהוא יודע</b></span><b>${known(EVERY)} / ${EVERY.length}</b></div>
  </div>
  <p class="note">${S.level>1 ? (S.lastReview ? `חזרה אחרונה על שלבים קודמים: ${S.lastReview.split("-").reverse().join("/")}. ` : "עוד לא נעשתה חזרה על שלבים קודמים. ") : ""}"נשכחו" = מילים שכבר ידע, טעה בהן, ועוד לא למד מחדש.</p>
  <p class="note">שלב חדש נפתח כשיודעים ${UNLOCK} מילים מהשלב הקודם. אפשר גם לפתוח או לסגור שלב ידנית. שלב שנסגר ייפתח שוב לבד כשיגיע ל-${UNLOCK} מילים בשלב הקודם (אם כבר עבר את זה, הוא יישאר סגור עד שתפתח אותו).</p>
  <h2>מבחני שלב וזמנים</h2>
  <div class="wordlist">
    ${LEVELS.map(l=>{ const t=testOf(l.n), o=tensesOpen(l.n), k=tensesDone(l.n);
      return `<div class="wl"><span>שלב ${l.n}: מבחן ${t ? `${t.best}/${TEST_N}${passedTest(l.n) ? " ✓" : ""}` : "—"} · זמנים${o?'':' 🔒'}</span><b>${k} / ${tensesOf(l.n).length} זמנים</b>${o?`<button class="mk" data-gc="${l.n}">סגור</button>`:`<button class="mk" data-go="${l.n}">פתח</button>`}</div>`; }).join("")}
  </div>
  <p class="note">הזמנים של כל שלב נפתחים אחרי שעוברים את מבחן השלב (${TEST_PASS} מתוך ${TEST_N}). המבחן לא עוצר מעבר לשלב הבא. אפשר גם לפתוח או לסגור ידנית.</p>
  <h2>מילים שהכי קשות לו</h2>
  ${hard.length?`<div class="wordlist">${hard.map(x=>`<div class="wl"><span class="en">${esc(x.en)}</span><span>${esc(x.he)}</span><span class="note" style="margin:0">${x.n} טעויות</span></div>`).join("")}</div>
  <p class="note">את המילים האלה כדאי לשלב השבוע ב"מילה של היום" ובשיחה.</p>`:`<p class="note">עוד אין טעויות רשומות.</p>`}
  <h2>בדיקת השמעה</h2>
  <button class="ghost" data-a="ttstest">השמע "hello"</button>
  <p class="note" id="ttsinfo" style="direction:rtl"></p>
  <h2>ימי תרגול אחרונים</h2>
  <p>${last.length?last.map(d=>d.split("-").reverse().slice(0,2).join("/")).join(" · "):"עוד לא תרגל."}</p>
  <div class="links"><button class="ghost" data-a="reset">איפוס כל ההתקדמות</button></div>`;
  app.querySelector('[data-a="home"]').onclick=()=>go({name:"home"});
  app.querySelector('[data-a="ttstest"]').onclick=()=>{
    speak("hello");
    document.getElementById("ttsinfo").innerHTML = [
      "גרסת עמוד: " + PAGE_VERSION,
      "סביבה: " + (/; wv\)/.test(navigator.userAgent) ? "אפליקציה (WebView)" : "דפדפן"),
      "גשר אנדרואיד: " + (window.AndroidTTS ? "יש" : "אין"),
      "דיבור דפדפן: " + ("speechSynthesis" in window ? "יש" : "אין"),
      "נוסה דרך: " + (lastSpeak || "-")
    ].join("<br>");
  };
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{ const n=+b.dataset.u; if(await ask(`לפתוח את שלב ${n} עכשיו?`, {ok:"פתיחה"})){ S.unlocked[n]=true; save(); render(); } });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=async()=>{ const lv=+b.dataset.go; if(await ask(`לפתוח את הזמנים של שלב ${lv} עכשיו?`, {ok:"פתיחה"})){ S.gunlocked["L"+lv]=true; save(); render(); } });
  app.querySelectorAll("[data-gc]").forEach(b=>b.onclick=async()=>{
    const lv=+b.dataset.gc;
    if(!await ask(`לסגור את הזמנים של שלב ${lv}?`, {ok:"סגירה"})) return;
    if(await ask(`למחוק גם את ההתקדמות בזמנים של שלב ${lv}?`, {sub:"כדאי אם רק בדקת אותם.", ok:"למחוק", cancel:"להשאיר", danger:true}))
      lvItems(lv).forEach(it=>{ delete S.gscore[it.id]; delete S.gwrong[it.id]; delete S.gseen[it.id]; });
    delete S.gunlocked["L"+lv];
    if(tensesOpen(lv)) S.gunlocked["L"+lv]=false;
    save(); render();
  });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{
    const n=+b.dataset.c;
    if(!await ask(`לסגור את שלב ${n}?`, {ok:"סגירה"})) return;
    if(await ask(`למחוק גם את ההתקדמות בשלב ${n}?`, {sub:"כדאי אם רק בדקת אותו.", ok:"למחוק", cancel:"להשאיר", danger:true})){
      LEVEL_WORDS[n-1].forEach(x=>{ delete S.score[x.en]; delete S.wrong[x.en]; });
      delete S.placedLv[n];
    }
    // Back to opening automatically, unless he already passed the threshold.
    delete S.unlocked[n];
    if(isOpen(n)) S.unlocked[n]=false;
    while(!isOpen(S.level)) S.level--;
    useLevel(S.level); save(); render();
  });
  app.querySelector('[data-a="reset"]').onclick=async()=>{ if(await ask("למחוק את כל ההתקדמות ולהתחיל מחדש?", {ok:"מחיקה", danger:true})){ S=Object.assign(fresh(), {pinHash:S.pinHash}); useLevel(1); save(); go({name:"home"}); } };
  app.querySelector('[data-a="rename"]').onclick=async()=>{
    const name = ((await askText("שם חדש", USERNAME, {ok:"שמירה"})) || "").trim().slice(0,30);
    if(!name || name===USERNAME) return;
    try{ const j = await api({action:"rename", u:USER, name}); if(!j.ok) throw new Error(j.error); USERNAME = name; rememberUser(USER, name); render(); }
    catch(e){ tell(errText(e)); }
  };
  app.querySelector('[data-a="share"]').onclick=async()=>{
    const link = shareLink();
    try{ await navigator.clipboard.writeText(link); flash("הקישור הועתק"); }catch(e){ copyBox("העתיקו את הקישור", link); }
  };
  app.querySelector('[data-a="newpin"]').onclick=()=>go({name:"pinset"});
  app.querySelectorAll("[data-manage]").forEach(b=>b.onclick=()=>{ const u=b.dataset.manage; useUser(u, null, parentOk.has(u) ? "parent" : "pin"); });
  app.querySelector('[data-a="addkid"]').onclick=()=>go({name:"welcome"});
  app.querySelector('[data-a="forget"]').onclick=async()=>{
    if(!await ask(`להסיר את ${USERNAME} מהטלפון הזה?`, {sub:`ההתקדמות נשמרת בענן, ואפשר לחזור עם קוד המשתמש ${fmtCode(USER)}.`, ok:"הסרה", danger:true})) return;
    if(pending) await push();
    forgetUser(USER); USER = null;
    const next = deviceUsers()[0];
    next ? useUser(next.u, next.name) : go({name:"welcome"});
  };
}

boot();
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
