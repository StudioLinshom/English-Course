<style>
:root{
  --field:#1F7A4D; --field-2:#2E9A63; --chalk:#F7F9F4; --paper:#FFFFFF;
  --ink:#1C2B4B; --muted:#5B6A85; --sun:#FFC83D; --coral:#F2574A; --line:#DCE4DA;
  --good-bg:#E3F5EA; --bad-bg:#FDE7E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#3FB97A; --field-2:#56CF8E; --chalk:#121A2B; --paper:#1B2540;
    --ink:#EEF2F8; --muted:#A3B0C8; --sun:#FFD25E; --coral:#FF7A6E; --line:#2C3858;
    --good-bg:#16382A; --bad-bg:#40201F;
  }
}
:root[data-theme="dark"]{
  --field:#3FB97A; --field-2:#56CF8E; --chalk:#121A2B; --paper:#1B2540;
  --ink:#EEF2F8; --muted:#A3B0C8; --sun:#FFD25E; --coral:#FF7A6E; --line:#2C3858;
  --good-bg:#16382A; --bad-bg:#40201F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:"Rubik","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.en{font-family:"Fredoka","Rubik",Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Scoreboard hero */
.board{background:var(--field);color:#fff;border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:3px solid rgba(255,255,255,.18);border-radius:50%}
.board h1{margin:0;font-size:20px;font-weight:700}
.big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.big .n{font-family:"Fredoka",sans-serif;font-size:64px;font-weight:700;line-height:1;color:var(--sun)}
.big .of{font-size:18px;opacity:.9}
.bar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.stats{display:flex;gap:18px;margin-top:12px;font-size:15px;opacity:.95}

h2{font-size:18px;margin:26px 0 10px}
.levels{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.lv{flex:none;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-size:15px;font-weight:600}
.lv.cur{background:var(--field);border-color:var(--field);color:#fff}
.lv:disabled{opacity:.55;cursor:default}
.mode.review{margin-top:12px}
.mode.review.due{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb, var(--sun) 35%, transparent)}
.mode.gram{margin-top:12px}
.rule{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.rule p{margin:0 0 8px}
.rule ul{margin:0 0 8px;padding-inline-start:20px}
.rule li{margin:4px 0}
.wl.ex{flex-wrap:wrap}
.wl.ex .en{flex-basis:100%;font-size:17px}
.sent{font-size:24px;font-weight:600;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--sun);margin:0 4px}
.opt.sent-opt{font-size:17px;text-align:left}
.sent-ans{font-size:20px;margin:6px 0}
.built{min-height:58px;margin-top:14px;padding:8px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .ph{color:var(--muted);font-size:14px;font-family:"Rubik",sans-serif;direction:rtl;width:100%;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.tile{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:600}
.built .tile{border-color:var(--field-2)}
.btn:disabled{opacity:.5}
.mode.next{margin-top:12px;border-color:var(--sun);background:var(--sun);color:#1C2B4B}
.mode.next span{color:#1C2B4B}
.weeks{display:grid;gap:10px}
.week{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:right;width:100%}
.week .num{flex:none;width:42px;height:42px;border-radius:12px;background:var(--chalk);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:20px;color:var(--field)}
.week.done .num{background:var(--sun);color:#1C2B4B}
.week .t{flex:1;min-width:0}
.week .t b{display:block;font-size:16px}
.week .t span{font-size:14px;color:var(--muted)}
.mini{height:6px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--field-2)}

.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sync{margin-inline-start:auto;align-self:center;font-size:14px;color:var(--muted)}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-inline-end:6px;vertical-align:middle}
.sync[data-s="ok"]::before{background:var(--field-2)}
.sync[data-s="saving"]::before{background:var(--sun)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;color:var(--muted)}

/* Screens */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px}
.top .title{font-weight:700;flex:1}
.modes{display:grid;gap:10px}
.mode{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:right;width:100%}
.mode b{display:block;font-size:17px}
.mode span{color:var(--muted);font-size:14px}
.wordlist{margin-top:20px;background:var(--paper);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.wl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .en{font-size:18px;font-weight:600}
.dots{display:flex;gap:3px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--field-2)}
.wl .en{flex:1}
.mk{flex:none;background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted)}
.mk.on{background:var(--field);border-color:var(--field);color:#fff}

/* Card */
.progress{font-size:14px;color:var(--muted);margin-bottom:8px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;min-height:230px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.card .word{font-size:44px;font-weight:700;line-height:1.1}
.card .he{font-size:28px;font-weight:700}
.card .hint{font-size:15px;color:var(--muted)}
.say{background:var(--chalk);border-radius:99px;padding:6px 14px;font-size:15px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border-radius:14px;padding:14px;font-size:17px;font-weight:700}
.btn.go{background:var(--field);color:#fff}
.btn.no{background:var(--paper);border:2px solid var(--line)}
.btn.wide{width:100%;margin-top:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:20px;font-weight:600;width:100%}
.opt.right{background:var(--good-bg);border-color:var(--field-2)}
.opt.wrong{background:var(--bad-bg);border-color:var(--coral)}
input.type{width:100%;margin-top:14px;padding:14px;font-size:24px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:center}
.feedback{margin-top:10px;font-weight:700;min-height:26px;text-align:center}
.feedback.ok{color:var(--field)} .feedback.bad{color:var(--coral)}

.result{text-align:center}
.result .n{font-family:"Fredoka",sans-serif;font-size:72px;color:var(--field);font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:4px 12px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
#flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.show{opacity:1}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
</style>
</head>

/* ---------- state + storage ---------- */
const fresh = () => ({score:{}, wrong:{}, days:[], placed:false, placedLv:{}, unlocked:{}, level:1, seen:{}, forgot:{}, lastReview:"", gscore:{}, gwrong:{}, gseen:{}, gunlocked:{}, updated:""});

let saveTimer = null, retryTimer = null, syncState = "offline", pending = false;
const SYNC_TEXT = {ok:"מסונכרן", saving:"שומר...", offline:"לא מחובר"};
function setSync(st){
  syncState = st;
  const el = document.getElementById("sync");
  if(el){ el.textContent = SYNC_TEXT[st]; el.dataset.s = st; }

// Fills fields added after launch and points WEEKS/ALL at the current level.
function normalize(){
  S.placedLv = S.placedLv || {}; if(S.placed) S.placedLv[1] = true;
  S.seen = S.seen || {}; S.forgot = S.forgot || {}; S.lastReview = S.lastReview || "";
  S.gscore = S.gscore || {}; S.gwrong = S.gwrong || {}; S.gseen = S.gseen || {}; S.gunlocked = S.gunlocked || {};
  migrateUnitKeys();
  keepOpenUnits();
  S.unlocked = S.unlocked || {};
  S.level = S.level >= 1 && S.level <= LEVELS.length && isOpen(S.level) ? S.level : 1;
  keepOpenLevels();
  useLevel(S.level);
}
// S.unlocked[n]: true = opened by a parent, false = closed by a parent, unset = opens at UNLOCK words.
function isOpen(n){ return n===1 || (S.unlocked[n] ?? known(LEVEL_WORDS[n-2]) >= UNLOCK); }
function keepOpenLevels(){
  for(let n=2; n<=LEVELS.length; n++)
    if(S.unlocked[n]===undefined && known(LEVEL_WORDS[n-2]) >= UNLOCK) S.unlocked[n] = true;
}
function setLevel(n){ S.level = n; useLevel(n); save(); go({name:"home"}); }
function writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function save(){
  keepOpenLevels(); keepOpenUnits();
  S.updated = new Date().toISOString();
  writeLocal();
  pending = true;
  setSync("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 1500);
}
async function push(){
  clearTimeout(retryTimer);
  if(!pending) return;
  setSync("saving");
  const sent = S.updated;
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({key:KEY, data:S})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"save failed");
    if(S.updated === sent) pending = false;
    setSync(pending ? "saving" : "ok");
    if(pending) saveTimer = setTimeout(push, 1500);
  }catch(e){
    setSync("offline");
    retryTimer = setTimeout(push, 30000);
  }
}
async function pull(){
  try{
    const r = await fetch(API + "?key=" + encodeURIComponent(KEY), {cache:"no-store"});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    if(d.updated && (!S.updated || d.updated > S.updated)){
      S = Object.assign(fresh(), d);
      normalize();
      writeLocal();
      if(view.name !== "play" && view.name !== "gplay") render();
      setSync("ok");
    } else if(S.updated && S.updated !== d.updated){
      pending = true; push();
    } else setSync("ok");
  }catch(e){
    setSync("offline");
    clearTimeout(retryTimer); retryTimer = setTimeout(()=>{ pending ? push() : pull(); }, 30000);
  }
}

const sc = en => S.score[en]||0;
const known = list => list.filter(w => sc(w.en) >= MASTER).length;
const today = () => new Date().toISOString().slice(0,10);
const daysSince = d => d ? Math.floor((Date.parse(today()) - Date.parse(d)) / 864e5) : Infinity;
function bump(en, ok){
  if(!ok && sc(en) >= MASTER) S.forgot[en] = (S.forgot[en]||0)+1;
  S.score[en] = ok ? Math.min(MASTER, sc(en)+1) : 0;
  if(!ok) S.wrong[en] = (S.wrong[en]||0)+1;
  const d = today();
  S.seen[en] = d;
  if(!S.days.includes(d)) S.days.push(d);
  save();
}
function weekDays(){
  const now = new Date(); const start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0);
  return S.days.filter(d => new Date(d+"T12:00:00") >= start).length;
}
function streak(){

  for(;;){ const k=d.toISOString().slice(0,10); if(S.days.includes(k)){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}

// Quiz/typing round: words not yet known (weakest first) plus a few known words
// for review. When everything is known, the whole round is review.
function pickRound(list){ return pickBy(list, x=>sc(x.en)); }
function pickBy(list, score){
  const weak = shuffle(list.filter(x=>score(x)<MASTER)).sort((a,b)=>score(a)-score(b));
  const strong = shuffle(list.filter(x=>score(x)>=MASTER));
  if(!weak.length) return strong.slice(0, ROUND);
  const review = Math.min(strong.length, weak.length >= ROUND ? 2 : 3);
  return shuffle([...weak.slice(0, ROUND-review), ...strong.slice(0, review)]);
}
const OLD_PER_ROUND = 2, REVIEW_ROUND = 10, REVIEW_EVERY = 7;
const prevWords = () => LEVEL_WORDS.slice(0, S.level-1).flat();
// Old words to bring back: ones not (or no longer) known first, then the least
// recently practiced, then the ones with most mistakes.
function oldestFirst(list, n){
  const rank = x => sc(x.en) >= MASTER ? 1 : 0;
  return shuffle(list).sort((a,b)=> rank(a)-rank(b) || (S.seen[a.en]||"").localeCompare(S.seen[b.en]||"") || (S.wrong[b.en]||0)-(S.wrong[a.en]||0)).slice(0, n);
}
// Flashcards: words not yet known first, known ones at the end.
function flashOrder(list){
  return [...shuffle(list.filter(x=>sc(x.en)<MASTER)), ...shuffle(list.filter(x=>sc(x.en)>=MASTER))];
}
function start(mode, list){
  let items = mode==="place" ? shuffle(ALL) : (mode==="flash" ? flashOrder(list) : pickRound(list));
  // Quiz and typing in level 2+ also bring back a couple of words from earlier levels.
  if((mode==="quiz" || mode==="type") && S.level > 1){
    const old = oldestFirst(prevWords(), OLD_PER_ROUND);
    items = shuffle([...items, ...old]);
  }
  go({name:"play", mode, items, i:0, right:0, missed:[], pool:list, back:view.w||null});
}

function startReview(){
  const prev = prevWords();
  go({name:"play", mode:"quiz", review:true, items:oldestFirst(prev, REVIEW_ROUND), i:0, right:0, missed:[], pool:prev, back:null});
}
function reviewCard(){
  if(S.level < 2) return "";
  const ago = daysSince(S.lastReview), due = ago >= REVIEW_EVERY;
  const when = S.lastReview ? (ago===0 ? "חזרה אחרונה: היום" : `חזרה אחרונה: לפני ${ago} ימים`) : "עוד לא עשית חזרה";
  return `<button class="mode review ${due?'due':''}" data-a="review"><b>${due?'הגיע הזמן לחזרה! ':''}חזרה על שלבים קודמים</b><span>${REVIEW_ROUND} שאלות ממילים של ${S.level===2?'שלב 1':'שלבים 1–'+(S.level-1)}. ${when}.</span></button>`;
}
function play(){
  const v=view, x=v.items[v.i];
  if(!x){ if(v.review){ S.lastReview = today(); save(); }
    if(v.mode==="place"){ S.placedLv[S.level]=true; if(S.level===1) S.placed=true; save(); } return go({name:"result", mode:v.mode, right:v.right, total:v.items.length, missed:v.missed, back:v.back}); }
  const head = `<div class="top"><button class="back" data-a="quit">יציאה</button><span class="title">${v.review ? "חזרה על שלבים קודמים" : {flash:"כרטיסיות",quiz:"בוחן",type:"כתיבה",place:"מבחן פתיחה"}[v.mode]}</span></div>
  <div class="progress">${v.i+1} מתוך ${v.items.length}</div>`;
  const pastLine = x.past ? `<div class="hint">עבר: <span class="en">${esc(x.past)}</span></div>` : "";

  if(v.mode==="flash" || v.mode==="place"){
    const askEn = v.mode==="place" || Math.random()<.5;
    app.innerHTML = head + `
      <div class="card pop" id="card">
        ${askEn ? `<div class="word en">${esc(x.en)}</div><button class="say" data-a="say">השמע</button>` : `<div class="he">${esc(x.he)}</div><div class="hint">איך אומרים באנגלית?</div>`}
      </div>
      <button class="btn go wide" data-a="flip">${v.mode==="place"?"אני יודע מה זה":"הפוך"}</button>
      ${v.mode==="place"?`<button class="btn no wide" data-a="dunno">עוד לא יודע</button>`:""}`;
    const sayB = app.querySelector('[data-a="say"]'); if(sayB) sayB.onclick=()=>speak(x.en);
    if(v.mode==="place"){
      app.querySelector('[data-a="flip"]').onclick=()=>{ S.score[x.en]=MASTER; v.right++; next(); };
      app.querySelector('[data-a="dunno"]').onclick=()=>{ S.score[x.en]=0; v.missed.push(x); next(); };
    } else {
      app.querySelector('[data-a="flip"]').onclick=()=>{
        speak(x.en);
        document.getElementById("card").innerHTML = `<div class="word en">${esc(x.en)}</div><div class="he">${esc(x.he)}</div>${pastLine}<button class="say" data-a="say2">השמע שוב</button>`;
        document.querySelector('[data-a="say2"]').onclick=()=>speak(x.en);
        const f = app.querySelector('[data-a="flip"]'); f.remove();
        app.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn go" data-a="yes">ידעתי</button><button class="btn no" data-a="no">עוד לא</button></div>`);
        app.querySelector('[data-a="yes"]').onclick=()=>{ bump(x.en,true); v.right++; next(); };
        app.querySelector('[data-a="no"]').onclick=()=>{ bump(x.en,false); v.missed.push(x); next(); };
      };
    }
  }

  if(v.mode==="quiz"){
    const toEn = Math.random()<.5;
    const others = shuffle((v.pool.length>=4?v.pool:ALL).filter(o=>o.en!==x.en)).slice(0,3);
    const opts = shuffle([x,...others]);
    app.innerHTML = head + `
      <div class="card pop">
        ${toEn ? `<div class="he">${esc(x.he)}</div><div class="hint">בחר את המילה באנגלית</div>`
               : `<div class="word en">${esc(x.en)}</div><button class="say" data-a="say">השמע</button><div class="hint">מה זה בעברית?</div>`}
      </div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt ${toEn?'en':''}" data-k="${k}">${esc(toEn?o.en:o.he)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    const sayB = app.querySelector('[data-a="say"]'); if(sayB) sayB.onclick=()=>speak(x.en);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k], ok=o.en===x.en;
      app.querySelectorAll(".opt").forEach((bb,k)=>{ bb.disabled=true; if(opts[k].en===x.en) bb.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      const fb=document.getElementById("fb");
      fb.className="feedback "+(ok?"ok":"bad"); fb.innerHTML = ok ? "נכון!" : `התשובה: <span class="en">${esc(x.en)}</span> = ${esc(x.he)}`;
      speak(x.en); bump(x.en,ok); if(ok) v.right++; else v.missed.push(x);
      setTimeout(next, ok?900:2000);
    });
  }

  if(v.mode==="type"){
    app.innerHTML = head + `
      <div class="card pop"><div class="he">${esc(x.he)}</div><div class="hint">כתוב באנגלית (${x.en.length} אותיות${x.en.includes(" ")?", כולל רווח":""})</div></div>
      <input class="type en" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here">
      <button class="btn go wide" data-a="check">בדיקה</button>
      <div class="feedback" id="fb"></div>`;
    const inp=document.getElementById("inp"); inp.focus();
    const check=()=>{
      if(inp.disabled) return;
      const ok = inp.value.trim().toLowerCase().replace(/\s+/g," ")===x.en;
      inp.disabled=true;
      const fb=document.getElementById("fb");
      fb.className="feedback "+(ok?"ok":"bad"); fb.innerHTML = ok ? "נכון!" : `הנכון: <span class="en">${esc(x.en)}</span>`;
      speak(x.en); bump(x.en,ok); if(ok) v.right++; else v.missed.push(x);
      const b=app.querySelector('[data-a="check"]'); b.textContent="הבא"; b.onclick=next;
      if(ok) setTimeout(()=>{ if(view===v && v.items[v.i]===x) next(); }, 1000);
    };
    app.querySelector('[data-a="check"]').onclick=check;
    inp.onkeydown=e=>{ if(e.key==="Enter"){ inp.disabled ? next() : check(); } };
  }
  app.querySelector('[data-a="quit"]').onclick=()=>{ save(); go(v.back?{name:"week",w:v.back}:{name:"home"}); };
  function next(){ if(view!==v) return; v.i++; save(); render(); }
}

function result(){
  const v=view;
  const msg = v.mode==="place" ? "מבחן הפתיחה הסתיים. מכאן מתחילים לעבוד שבוע אחרי שבוע."
    : v.right===v.total ? "מושלם! כל התשובות נכונות." : v.right/v.total>=.7 ? "יפה מאוד. עוד קצת חזרה וזה שלך." : "התחלה טובה. כדאי לעשות עוד סבב כרטיסיות.";
  app.innerHTML = `
  <div class="result">
    <div class="n">${v.right}/${v.total}</div>
    <p>${msg}</p>
    ${v.missed.length?`<h2>${v.mode==="place"?"מילים ללמוד":"מילים לחזרה"}</h2><div class="chips">${v.missed.slice(0,40).map(x=>`<span class="chip"><span class="en">${esc(x.en)}</span> · ${esc(x.he)}</span>`).join("")}</div>${v.missed.length>40?`<p class="note">ועוד ${v.missed.length-40} מילים</p>`:""}`:""}
    <button class="btn go wide" data-a="again">${v.back?"חזרה לשבוע":"למסך הבית"}</button>
  </div>`;
  app.querySelector('[data-a="again"]').onclick=()=>go(v.back?{name:"week",w:v.back}:{name:"home"});
}

const G_UNLOCK = 0.8; // share of a unit's sentences known before the next unit opens
GRAMMAR.forEach(u => u.items.forEach((it, i) => { it.id = u.id + ":" + i; }));
const gsc = it => S.gscore[it.id] || 0;
const gknown = u => u.items.filter(it => gsc(it) >= MASTER).length;
const gneed = u => Math.ceil(u.items.length * G_UNLOCK);
// S.gunlocked[unit id] works like S.unlocked for levels: true/false = set by a parent or kept open, unset = automatic.
function gOpen(n){ return n===0 || (S.gunlocked[GRAMMAR[n].id] ?? gknown(GRAMMAR[n-1]) >= gneed(GRAMMAR[n-1])); }
function keepOpenUnits(){
  for(let n=1; n<GRAMMAR.length; n++)
    if(S.gunlocked[GRAMMAR[n].id]===undefined && gknown(GRAMMAR[n-1]) >= gneed(GRAMMAR[n-1])) S.gunlocked[GRAMMAR[n].id] = true;
}
// Units were first keyed by position, in this order.
const OLD_UNIT_ORDER = ["ps","pc","im","pa"];
function migrateUnitKeys(){
  for(const k of Object.keys(S.gunlocked)) if(/^\d+$/.test(k)){
    const id = OLD_UNIT_ORDER[k];
    if(id && S.gunlocked[id]===undefined) S.gunlocked[id] = S.gunlocked[k];
    delete S.gunlocked[k];
  }
}
function topUnit(){ let n=0; while(n+1<GRAMMAR.length && gOpen(n+1)) n++; return n; }
function gbump(it, ok){
  S.gscore[it.id] = ok ? Math.min(MASTER, gsc(it)+1) : 0;
  if(!ok) S.gwrong[it.id] = (S.gwrong[it.id]||0)+1;
  const d = today();
  S.gseen[it.id] = d;
  if(!S.days.includes(d)) S.days.push(d);
  save();
}
function gRound(n){
  const items = pickBy(GRAMMAR[n].items, gsc);
  // Bring back sentences from earlier units: not known first, then least recently practiced.
  const rank = it => gsc(it) >= MASTER ? 1 : 0;
  const old = shuffle(GRAMMAR.slice(0, n).flatMap(u=>u.items))
    .sort((a,b)=> rank(a)-rank(b) || (S.gseen[a.id]||"").localeCompare(S.gseen[b.id]||"")).slice(0, OLD_PER_ROUND);
  return shuffle([...items, ...old]);
}
const gText = it => it.t==="order" ? it.w + it.p : it.t==="fill" ? it.s.replace("___", it.a) : it.a;
const tileText = (t, i) => i===0 && t!=="I" && !t.startsWith("I'") ? t.charAt(0).toLowerCase() + t.slice(1) : t;
const unitOf = it => GRAMMAR.find(u => u.items.includes(it));

function grammarCard(){
  const n = topUnit(), u = GRAMMAR[n];
  return `<button class="mode gram" data-a="grammar"><b>משפטים וזמנים ✍️</b><span>יחידה ${n+1}: ${u.name} · ${gknown(u)} מתוך ${u.items.length} משפטים</span></button>`;
}

function gplay(){
  const v=view, it=v.items[v.i];
  if(!it) return go({name:"gresult", n:v.n, right:v.right, total:v.items.length, missed:v.missed});
  const u = unitOf(it);
  const head = `<div class="top"><button class="back" data-a="quit">יציאה</button><span class="title">${u.name}</span></div>
  <div class="progress">${v.i+1} מתוך ${v.items.length}</div>`;
  let body = "";
  if(it.t==="fill"){
    const [pre, post] = it.s.split("___");
    v.opts = v.opts || shuffle([it.a, ...it.o]);
    body = `<div class="card pop"><div class="sent en">${esc(pre)}<span class="blank">&nbsp;</span>${esc(post)}</div><div class="hint">${esc(it.he)}</div></div>
      <div class="opts">${v.opts.map((o,k)=>`<button class="opt en" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else if(it.t==="choose"){
    v.opts = v.opts || shuffle([it.a, ...it.o]);
    body = `<div class="card pop"><div class="he">${esc(it.he)}</div><div class="hint">בחר את המשפט הנכון</div></div>
      <div class="opts">${v.opts.map((o,k)=>`<button class="opt en sent-opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else {
    if(!v.tiles){ const words = it.w.split(" "); v.tiles = shuffle([...words.map(tileText), it.d]).map((t,k)=>({t,k})); v.built = []; }
    body = `<div class="card pop"><div class="he">${esc(it.he)}</div><div class="hint">סדר את המילים למשפט באנגלית</div></div>
      <div class="built en" id="built">${v.built.map(k=>`<button class="tile" data-b="${k}">${esc(v.tiles[k].t)}</button>`).join("") || '<span class="ph">לחץ על המילים לפי הסדר</span>'}</div>
      <div class="tiles en">${v.tiles.map(x=>v.built.includes(x.k)?'':`<button class="tile" data-t="${x.k}">${esc(x.t)}</button>`).join("")}</div>
      <button class="btn go wide" data-a="check" ${v.built.length?'':'disabled'}>בדיקה</button>`;
  }
  app.innerHTML = head + body + `<div class="feedback" id="fb"></div>`;
  app.querySelector('[data-a="quit"]').onclick=()=>go({name:"gunit", n:v.n});

  const finish = ok => {
    gbump(it, ok); if(ok) v.right++; else v.missed.push(it);
    const fb=document.getElementById("fb");
    fb.className="feedback "+(ok?"ok":"bad");
    fb.innerHTML = (ok ? "נכון! " : "התשובה הנכונה: ") + `<div class="en sent-ans">${esc(gText(it))}</div><button class="btn go wide" data-a="next">הבא</button>`;
    speak(gText(it));
    app.querySelectorAll(".opt,.tile,[data-a=check]").forEach(b=>b.disabled=true);
    app.querySelector('[data-a="next"]').onclick=next;
  };
  if(it.t==="fill" || it.t==="choose"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const pick=v.opts[+b.dataset.k], ok = pick===it.a;
      app.querySelectorAll(".opt").forEach((bb,k)=>{ if(v.opts[k]===it.a) bb.classList.add("right"); });

      finish(ok);
    });
  } else {
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ v.built.push(+b.dataset.t); render(); });
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ v.built = v.built.filter(k=>k!==+b.dataset.b); render(); });
    app.querySelector('[data-a="check"]').onclick=()=>{
      const said = v.built.map(k=>v.tiles[k].t).join(" ").toLowerCase();
      finish([it.w, ...it.alt].some(a=>a.toLowerCase()===said));

    <div class="n">${v.right}/${v.total}</div>
    <p>${v.right===v.total ? "מושלם! כל המשפטים נכונים." : v.right/v.total>=.7 ? "יפה מאוד! עוד קצת תרגול וזה שלך." : "התחלה טובה. כדאי לקרוא שוב את ההסבר ולתרגל עוד סבב."}</p>
    ${v.missed.length?`<h2>משפטים לחזרה</h2><div class="wordlist">${v.missed.map(it=>`<div class="wl ex"><span class="en">${esc(gText(it))}</span><span>${esc(it.he)}</span></div>`).join("")}</div>`:""}
    <button class="btn go wide" data-a="again">חזרה ליחידה</button>
  </div>`;
  app.querySelector('[data-a="again"]').onclick=()=>go({name:"gunit", n:v.n});
}

function parent(){
  const hard = Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,15)
    .map(([en,n])=>{ const x=EVERY.find(w=>w.en===en); return x?{...x,n}:null; }).filter(Boolean);
  const last = S.days.slice(-14).reverse();
  app.innerHTML = `
  <div class="top"><button class="back" data-a="home">חזרה</button><span class="title">מסך הורה</span></div>
  <h2>שלב ${S.level}</h2>
  <div class="wordlist">
    ${WEEKS.map(w=>{const l=ALL.filter(x=>x.week===w.n);return `<div class="wl"><span>שבוע ${w.n}: ${w.name}</span><b>${known(l)} / ${l.length}</b></div>`;}).join("")}
    <div class="wl"><span><b>סה"כ בשלב</b></span><b>${known(ALL)} / ${ALL.length}</b></div>
  </div>
  <h2>כל השלבים</h2>
  <div class="wordlist">
    ${LEVELS.map(l=>{ const lw=LEVEL_WORDS[l.n-1], o=isOpen(l.n);
      const dropped = lw.filter(x=>S.forgot[x.en] && sc(x.en)<MASTER).length;
      return `<div class="wl"><span>שלב ${l.n}${o?'':' 🔒'}${dropped?` <span class="note" style="margin:0">(${dropped} נשכחו)</span>`:''}</span><b>${known(lw)} / ${lw.length}</b>${l.n===1?'':o?`<button class="mk" data-c="${l.n}">סגור</button>`:`<button class="mk" data-u="${l.n}">פתח</button>`}</div>`; }).join("")}
    <div class="wl"><span><b>סה"כ מילים שהוא יודע</b></span><b>${known(EVERY)} / ${EVERY.length}</b></div>
  </div>
  <p class="note">${S.level>1 ? (S.lastReview ? `חזרה אחרונה על שלבים קודמים: ${S.lastReview.split("-").reverse().join("/")}. ` : "עוד לא נעשתה חזרה על שלבים קודמים. ") : ""}"נשכחו" = מילים שכבר ידע, טעה בהן, ועוד לא למד מחדש.</p>
  <p class="note">שלב חדש נפתח כשיודעים ${UNLOCK} מילים מהשלב הקודם. אפשר גם לפתוח או לסגור שלב ידנית. שלב שנסגר ייפתח שוב לבד כשיגיע ל-${UNLOCK} מילים בשלב הקודם (אם כבר עבר את זה, הוא יישאר סגור עד שתפתח אותו).</p>
  <h2>משפטים וזמנים</h2>
  <div class="wordlist">
    ${GRAMMAR.map((u,n)=>{ const o=gOpen(n);
      return `<div class="wl"><span>${n+1}. ${u.name}${o?'':' 🔒'}</span><b>${gknown(u)} / ${u.items.length}</b>${n===0?'':o?`<button class="mk" data-gc="${n}">סגור</button>`:`<button class="mk" data-go="${n}">פתח</button>`}</div>`; }).join("")}
  </div>
  <h2>מילים שהכי קשות לו</h2>
  ${hard.length?`<div class="wordlist">${hard.map(x=>`<div class="wl"><span class="en">${esc(x.en)}</span><span>${esc(x.he)}</span><span class="note" style="margin:0">${x.n} טעויות</span></div>`).join("")}</div>
  <p class="note">את המילים האלה כדאי לשלב השבוע ב"מילה של היום" ובשיחה.</p>`:`<p class="note">עוד אין טעויות רשומות.</p>`}
  <h2>בדיקת השמעה</h2>
  <button class="ghost" data-a="ttstest">השמע "hello"</button>
  <p class="note" id="ttsinfo" style="direction:rtl"></p>
  <h2>ימי תרגול אחרונים</h2>
  <p>${last.length?last.map(d=>d.split("-").reverse().slice(0,2).join("/")).join(" · "):"עוד לא תרגל."}</p>
  <div class="links"><button class="ghost" data-a="reset">איפוס כל ההתקדמות</button></div>`;
  app.querySelector('[data-a="home"]').onclick=()=>go({name:"home"});
  app.querySelector('[data-a="ttstest"]').onclick=()=>{
    speak("hello");
    document.getElementById("ttsinfo").innerHTML = [
      "גרסת עמוד: " + PAGE_VERSION,
      "סביבה: " + (/; wv\)/.test(navigator.userAgent) ? "אפליקציה (WebView)" : "דפדפן"),
      "גשר אנדרואיד: " + (window.AndroidTTS ? "יש" : "אין"),
      "דיבור דפדפן: " + ("speechSynthesis" in window ? "יש" : "אין"),
      "נוסה דרך: " + (lastSpeak || "-")
    ].join("<br>");
  };
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.u; if(confirm(`לפתוח את שלב ${n} עכשיו?`)){ S.unlocked[n]=true; save(); render(); } });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.go; if(confirm(`לפתוח את יחידה ${n+1} עכשיו?`)){ S.gunlocked[GRAMMAR[n].id]=true; save(); render(); } });
  app.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.gc, u=GRAMMAR[n];
    if(!confirm(`לסגור את יחידה ${n+1}?`)) return;
    if(confirm(`למחוק גם את ההתקדמות ביחידה ${n+1}? כדאי אם רק בדקת אותה.`))
      u.items.forEach(it=>{ delete S.gscore[it.id]; delete S.gwrong[it.id]; delete S.gseen[it.id]; });
    delete S.gunlocked[u.id];
    if(gOpen(n)) S.gunlocked[u.id]=false;
    save(); render();
  });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.c;
    if(!confirm(`לסגור את שלב ${n}?`)) return;
    if(confirm(`למחוק גם את ההתקדמות בשלב ${n}? כדאי אם רק בדקת אותו.`)){
      LEVEL_WORDS[n-1].forEach(x=>{ delete S.score[x.en]; delete S.wrong[x.en]; });
      delete S.placedLv[n];
    }
    // Back to opening automatically, unless he already passed the threshold.
    delete S.unlocked[n];
    if(isOpen(n)) S.unlocked[n]=false;
    while(!isOpen(S.level)) S.level--;
    useLevel(S.level); save(); render();
  });
  app.querySelector('[data-a="reset"]').onclick=()=>{ if(confirm("למחוק את כל ההתקדמות ולהתחיל מחדש?")){ S=fresh(); useLevel(1); save(); go({name:"home"}); } };
}

loadLocal(); render(); pull();
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
